spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

chronos:
  jwt:
    secret: chronos-pulse-test-secret-key-must-be-at-least-256-bits-long-hs256
    expiration-ms: 3600000
    refresh-expiration-ms: 28800000
  mail:
    enabled: false
