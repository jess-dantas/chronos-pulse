          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: Fiscal & Auditoria (Portaria 671)
    meta:
      id: fld_a14efe2b770c4d14a859308ecad03396
      created: 1725278400000
      modified: 1725278400000
      sortKey: -1788352684575
      description: "Geração e download do Arquivo Eletrônico de Jornada (AEJ)."
    children:
      - url: "{{ _.base_url }}/api/v1/fiscal/aej/download"
        name: Download Arquivo Fiscal AEJ
        meta:
          id: req_2e8ed67b46bb491cbdc9f292eba92cef
          created: 1725278400000
          modified: 1788355262130
          isPrivate: false
          description: "Gera arquivo fiscal AEJ segundo a Portaria MTP 671/2021."
          sortKey: -1725278200000
        method: GET
        parameters:
          - name: cnpj
            value: "{{ _.cnpj_teste }}"
          - name: razaoSocial
            value: Chronos Pulse Tech LTDA
        headers:
          - name: Authorization
            value: "Bearer {{ _.token_admin_empresa }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
