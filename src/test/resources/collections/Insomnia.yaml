                  "longitude": -46.633308,
                  "precisaoGps": 4.2,
                  "fotoUrl": null,
                  "hashLocal": "hashLocalIntervalo123"
                },
                {
                  "idLocal": "c2f45c88-7a1a-4d22-921e-123456789022",
                  "dataHoraDispositivo": "2026-09-03T13:00:00Z",
                  "latitude": -23.550520,
                  "longitude": -46.633308,
                  "precisaoGps": 3.8,
                  "fotoUrl": null,
                  "hashLocal": "hashLocalRetorno123"
                }
              ]
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: "Bearer {{ _.token_colaborador }}"
        settings:
          renderRequestBody: true
