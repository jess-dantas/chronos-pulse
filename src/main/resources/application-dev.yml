spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chronos_db}
    username: ${SPRING_DATASOURCE_USERNAME:chronos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:chronos_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # db/seed contém R__seed_admin_dev.sql (Administrator de desenvolvimento);
    # em produção as locations continuam apenas db/migration (zero-trace).
    locations: classpath:db/migration,classpath:db/seed
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

chronos:
  admin:
    # Dev: 2FA opt-in (seed R__seed_admin_dev.sql nasce sem 2FA habilitado).
    two-factor-required: false
  mail:
    enabled: ${CHRONOS_MAIL_ENABLED:false}
    from: ${CHRONOS_MAIL_FROM:no-reply@chronospulse.com.br}
    remetente-nome: ${CHRONOS_MAIL_NAME:Chronos Pulse}
