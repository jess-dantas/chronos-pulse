spring:
  application:
    name: chronos-pulse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}

chronos:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000        # 1 hora (access token)
    refresh-expiration-ms: 28800000  # 8 horas (limite absoluto da sessão)
  cors:
    allowed-origins: ${CHRONOS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200,https://chronos-pulse.netlify.app,https://*.netlify.app}
  telemetria:
    enabled: ${TELEMETRIA_ENABLED:true}
    retention-dias: ${TELEMETRIA_RETENTION_DIAS:30}
    app-versao: ${TELEMETRIA_APP_VERSAO:1.0.0}
    request-log: ${TELEMETRIA_REQUEST_LOG:true}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
