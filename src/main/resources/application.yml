spring:
  application:
    name: chronos-pulse
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chronos_db}
    username: ${SPRING_DATASOURCE_USERNAME:chronos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:chronos_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

chronos:
  jwt:
    secret: ${JWT_SECRET:chronos-pulse-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 3600000        # 1 hora
    refresh-expiration-ms: 604800000  # 7 dias