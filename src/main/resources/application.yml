spring:
  application:
    name: chronos-pulse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false

server:
  port: ${PORT:3030}

chronos:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000        # 1 hora (access token)
    refresh-expiration-ms: 28800000  # 8 horas (limite absoluto da sessão)
  admin:
    # true (produção): 2FA do Administrator é obrigatório — login força o
    # wizard de setup e /2fa/disable retorna 403. false (dev): opt-in.
    two-factor-required: ${CHRONOS_ADMIN_2FA_REQUIRED:true}
  cors:
    allowed-origins: ${CHRONOS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3030,http://localhost:4200,https://chronos-pulse-portal.vercel.app}
  telemetria:
    enabled: ${TELEMETRIA_ENABLED:true}
    retention-dias: ${TELEMETRIA_RETENTION_DIAS:30}
    app-versao: ${TELEMETRIA_APP_VERSAO:1.0.0}
    request-log: ${TELEMETRIA_REQUEST_LOG:true}
  fiscal:
    assinatura:
      pfx-base64: ${FISCAL_PFX_BASE64:}
      pfx-senha: ${FISCAL_PFX_SENHA:}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
  paths-to-exclude: /admin/**
  show-actuator: false
