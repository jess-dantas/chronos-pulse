spring:
  application:
    name: chronos-pulse
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chronos_db}
    username: ${SPRING_DATASOURCE_USERNAME:chronos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:chronos_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080