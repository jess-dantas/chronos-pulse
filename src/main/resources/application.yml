spring:
  application:
    name: chronos-pulse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

chronos:
  jwt:
    secret: ${JWT_SECRET:chronos-pulse-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 3600000        # 1 hora
    refresh-expiration-ms: 604800000  # 7 dias
