name: Deploy Production Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_database:
        description: 'Limpa o banco demo do Render (flyway:clean) e reaplica o baseline'
        type: boolean
        default: false
      limpar_historico_ponto:
        description: 'Apaga todos os registros de ponto (DELETE FROM registro_ponto)'
        type: boolean
        default: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://chronos-pulse.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: chmod +x mvnw

      - name: Reset Flyway history (demo — apenas via dispatch com checkbox)
        if: ${{ inputs.reset_database == true }}
        run: |
          ./mvnw -B flyway:clean \
            -Dflyway.cleanDisabled=false \
            -Dflyway.url="${{ secrets.DB_URL }}" \
            -Dflyway.user="${{ secrets.DB_USER }}" \
            -Dflyway.password="${{ secrets.DB_PASSWORD }}"

      - name: Run Flyway migrations (production)
        run: |
          ./mvnw -B flyway:migrate \
            -Dflyway.url="${{ secrets.DB_URL }}" \
            -Dflyway.user="${{ secrets.DB_USER }}" \
            -Dflyway.password="${{ secrets.DB_PASSWORD }}"

      - name: Limpar histórico de ponto (apenas via dispatch com checkbox)
        if: ${{ inputs.limpar_historico_ponto == true }}
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          PG_URL="${DB_URL#jdbc:}"
          PGPASSWORD="$DB_PASSWORD" psql "$PG_URL" -U "$DB_USER" \
            -v ON_ERROR_STOP=1 \
            -c "DELETE FROM registro_ponto"

      - run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "::warning::RENDER_DEPLOY_HOOK_URL não configurado nos Secrets."
          fi