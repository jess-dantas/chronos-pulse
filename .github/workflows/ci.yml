name: CI Backend Java

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: chmod +x mvnw

      - run: ./mvnw -B clean package
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'chronos-pulse-ci-secret-key-only-for-tests-256-bits' }}

  security:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: chmod +x mvnw

      - run: ./mvnw -B -q dependency:go-offline -DskipTests

      - uses: aquasecurity/setup-trivy@0.3.1

      - run: |
          set -o pipefail
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs target --format sarif --output trivy-results.sarif .

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
