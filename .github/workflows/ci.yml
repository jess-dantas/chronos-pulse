name: CI & Deploy Backend Java

on:
  push:
    branches: [develop, staging, main] # ← Adicionadas staging e main
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Análise, Testes e Compilação
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests & package
        run: ./mvnw -B clean package
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'chronos-pulse-ci-secret-key-only-for-tests-256-bits' }}

  # 2. Varredura de Segurança
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve dependências para o Trivy
        run: ./mvnw -B -q dependency:go-offline -DskipTests

      - name: Instala Trivy
        uses: aquasecurity/setup-trivy@v0.2.0

      - name: Trivy - varredura de dependências e código
        run: |
          set -o pipefail
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs target \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload relatório SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # 3. Deploy Staging (Render)
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://chronos-pulse.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Flyway migrations (staging)
        run: ./mvnw -B flyway:migrate -Dflyway.url="$DB_URL" -Dflyway.user="$DB_USER" -Dflyway.password="$DB_PASSWORD"
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Converter nome do repositório para lowercase
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:staging
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Dispara a atualização automática do serviço no Render via Webhook
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK_URL"

  # 4. Deploy Produção (Kubernetes / Infra Futura)
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    permissions:
      contents: read
      packages: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar configuração da produção
        id: gate
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASSWORD" ] && [ -n "$KUBE_CONFIG" ]; then
            echo "Produção configurada. Aplicando migrações e deploy."
            echo "infra_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Produção ainda não configurada (faltam DB_URL/DB_USER/DB_PASSWORD/KUBE_CONFIG). Deploy de produção ignorado."
            echo "infra_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Converter nome do repositório para lowercase
        if: steps.gate.outputs.infra_ready == 'true'
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Run Flyway migrations (production)
        if: steps.gate.outputs.infra_ready == 'true'
        run: ./mvnw -B flyway:migrate -Dflyway.url="$DB_URL" -Dflyway.user="$DB_USER" -Dflyway.password="$DB_PASSWORD"
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.infra_ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (production)
        if: steps.gate.outputs.infra_ready == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up kubectl
        if: steps.gate.outputs.infra_ready == 'true'
        uses: azure/setup-kubectl@v4

      - name: Deploy to Kubernetes (production)
        if: steps.gate.outputs.infra_ready == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig.yaml
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > "$KUBECONFIG"
          kubectl --namespace=chronos set image deployment/chronos-pulse \
            chronos-pulse=ghcr.io/${{ env.IMAGE_NAME }}:latest
          rm -f "$KUBECONFIG"