name: CI & Deploy Backend Java

on:
  push:
    branches: [develop]
  pull_request:
    branches: [staging, main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Dar permissão de execução ao mvnw
        run: chmod +x mvnw

      - name: Run tests & package
        run: ./mvnw -B clean package
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'chronos-pulse-ci-secret-key-only-for-tests-256-bits' }}

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Dar permissão de execução ao mvnw
        run: chmod +x mvnw

      - name: Resolve dependências para o Trivy
        run: ./mvnw -B -q dependency:go-offline -DskipTests

      - name: Instala Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy - varredura de dependências e código
        run: |
          set -o pipefail
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs target \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload relatório SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://chronos-pulse.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Dar permissão de execução ao mvnw
        run: chmod +x mvnw

      - name: Run Flyway migrations (production)
        run: ./mvnw -B flyway:migrate -Dflyway.url="$DB_URL" -Dflyway.user="$DB_USER" -Dflyway.password="$DB_PASSWORD"
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Converter nome do repositório para lowercase
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "::warning::RENDER_DEPLOY_HOOK_URL não configurado nos Secrets."
          fi