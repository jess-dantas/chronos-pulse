name: CI Backend

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build
        run: sh mvnw -B clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        run: sh mvnw -B test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'chronos-pulse-ci-secret-key-only-for-tests-256-bits' }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instala Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy - varredura de dependências e código (fs)
        run: |
          set -o pipefail
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs '$fresh' \
            --skip-dirs target \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload relatório SARIF (Code Scanning)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ======================= DEPLOY POR AMBIENTE =======================
  # develop: branch de trabalho local — somente CI acima, sem deploy cloud.
  # staging: demonstração para clientes/prefeituras (hoje hospedada no Render).
  # production: operação real — infra cloud futura (k8s pronto para quando existir).
  # --------------------------------------------------------------------

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: [build, test, security]
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://chronos-pulse.onrender.com
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Flyway migrations (staging)
        run: sh mvnw -B flyway:migrate -Dflyway.url="$DB_URL" -Dflyway.user="$DB_USER" -Dflyway.password="$DB_PASSWORD"
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (staging)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, test, security]
    permissions:
      contents: read
      packages: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Verificar configuração da produção
        id: gate
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASSWORD" ] && [ -n "$KUBE_CONFIG" ]; then
            echo "Produção configurada. Aplicando migrações e deploy."
            echo "infra_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Produção ainda não configurada (faltam DB_URL/DB_USER/DB_PASSWORD/KUBE_CONFIG). Deploy de produção ignorado até a infra existir."
            echo "infra_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Flyway migrations (production)
        if: steps.gate.outputs.infra_ready == 'true'
        run: sh mvnw -B flyway:migrate -Dflyway.url="$DB_URL" -Dflyway.user="$DB_USER" -Dflyway.password="$DB_PASSWORD"
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.infra_ready == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (production)
        if: steps.gate.outputs.infra_ready == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Set up kubectl
        if: steps.gate.outputs.infra_ready == 'true'
        uses: azure/setup-kubectl@v5.1.0

      - name: Deploy to Kubernetes (production)
        if: steps.gate.outputs.infra_ready == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig.yaml
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > "$KUBECONFIG"
          kubectl --namespace=chronos set image deployment/chronos-pulse \
            chronos-pulse=ghcr.io/${{ github.repository }}:latest
          rm -f "$KUBECONFIG"